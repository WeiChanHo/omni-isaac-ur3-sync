[package]
name = "omni.isaac.ur3_sync"
title = "UR3 Robot Poser Executor"
description = "Captures or loads Isaac Sim UR3 joint targets before executing them on a physical UR3 through ROS 2"
version = "1.5.0"
category = "Robotics"
keywords = ["isaacsim", "robotics", "ros2", "ur3"]

[dependencies]
"omni.kit.uiapp" = {}
"omni.kit.window.popup_dialog" = {}
"omni.timeline" = {}
"isaacsim.core.experimental.prims" = {}
"isaacsim.core.utils" = {}
"omni.physx" = {}
"isaacsim.ros2.bridge" = {}
"isaacsim.robot.poser" = {}

[[python.module]]
name = "omni.isaac.ur3_sync"
path = "exts"
